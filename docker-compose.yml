version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3-alpine
    container_name: road_pothole_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-pothole_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pothole_network

  redis:
    image: redis:alpine
    container_name: road_pothole_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - pothole_network

  ollama:
    image: ollama/ollama:latest
    container_name: road_pothole_ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - pothole_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: road_pothole_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-pothole_db}
      - REDIS_URL=redis://redis:6379/0
      - ML_SERVICE_URL=http://ml-service:8771
    ports:
      - "8770:8770"
    depends_on:
      - db
      - redis
    networks:
      - pothole_network

  ml-service:
    build:
      context: ./ml
      dockerfile: Dockerfile
    container_name: road_pothole_ml
    restart: always
    environment:
      - OLLAMA_URL=http://ollama:11434
    ports:
      - "8771:8771"
    depends_on:
      - ollama
    networks:
      - pothole_network

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: road_pothole_nginx
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
      - ml-service
    networks:
      - pothole_network

networks:
  pothole_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  ollama_data:
